name: Publish Social Eyes public website
on:
  push:
    branches: [main, phase1/verification-hardening-20261118]
    paths:
      - .github/workflows/publish-social-eyes.yml
      - index.html
      - assets/**
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: social-eyes-web-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate public website branding
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/app.js
          test -s assets/app.css
          node -e "const h=require('fs').readFileSync('index.html','utf8');const n=(h.match(/data:image\\/webp;base64,/g)||[]).length;if(n!==4)process.exit(1);if(!h.includes('class=\\\"brand-wordmark\\\"')||!h.includes('class=\\\"hero-eye\\\"'))process.exit(1)"
      - name: Stage public-only static preview
        run: |
          mkdir -p _web-preview
          cp index.html _web-preview/index.html
          cp -R assets _web-preview/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _web-preview
      - id: deployment
        uses: actions/deploy-pages@v4
