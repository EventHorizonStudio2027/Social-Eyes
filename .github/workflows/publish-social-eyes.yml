name: Publish Social Eyes public website
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-social-eyes.yml
      - index.html
      - assets/**
      - tests/public-brand.test.cjs
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: social-eyes-web-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate public website branding
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/app.js
          test -s assets/app.css
          node tests/public-brand.test.cjs
      - name: Stage public-only static preview
        run: |
          mkdir -p _web-preview
          cp index.html _web-preview/index.html
          printf 'Social Eyes public build\\nCommit: %s\\n' "$GITHUB_SHA" > _web-preview/deployment-version.txt
          cp -R assets _web-preview/assets
          touch _web-preview/.nojekyll
          cp tests/public-brand.test.cjs _web-preview/brand-validation-source.txt
          printf 'User-agent: *\\nAllow: /\\n' > _web-preview/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _web-preview
      - id: deployment
        uses: actions/deploy-pages@v4
