name: Social Eyes Phase 1 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript parser for offline tests
        run: |
          npm install --prefix "$RUNNER_TEMP/social-eyes-test-tools" --no-package-lock --no-audit --no-fund typescript@5.9.3
          echo "NODE_PATH=$RUNNER_TEMP/social-eyes-test-tools/node_modules" >> "$GITHUB_ENV"
      - name: JavaScript syntax
        run: |
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
      - name: Static integration smoke tests
        run: node tests/smoke.test.cjs
      - name: Full offline Phase 1 regression suite
        run: npm run test:foundation
      - name: Static privacy and package audits
        run: |
          npm run audit:static
          npm run audit:package
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop avatar behavior
        run: node tests/browser.test.cjs
