name: Phase 1 verification
on:
  push:
    branches: [main, 'phase1/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies without modifying lockfile
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Offline verification
        run: npm run verify:phase1
      - name: Avatar audit
        run: npm run audit:avatar
  detect-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        run: |
          if test -f package-lock.json; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
  full-build:
    needs: detect-lockfile
    if: needs.detect-lockfile.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lockfile before caching
        run: node scripts/verify-lockfile.mjs
      - name: Reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Expo Doctor
        run: npm run doctor
      - name: Fail-closed release preflight
        run: npm run preflight:release
  build-readiness-gate:
    needs: [offline, detect-lockfile, full-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOCKFILE_EXISTS: ${{ needs.detect-lockfile.outputs.exists }}
      BUILD_RESULT: ${{ needs.full-build.result }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
    steps:
      - name: Require all verification lanes
        run: |
          if [[ "$OFFLINE_RESULT" != 'success' ]]; then echo 'Offline checks failed'; exit 1; fi
          if [[ "$LOCKFILE_EXISTS" != 'true' ]]; then echo 'Missing committed lockfile'; exit 1; fi
          if [[ "$BUILD_RESULT" != 'success' ]]; then echo 'Dependency build did not pass'; exit 1; fi
