name: Phase 1 source readiness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require complete application source before claiming build readiness
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json app.json tsconfig.json src/providers/AuthProvider.tsx src/lib/profiles.ts scripts/phase1-verify.mjs .github/workflows/phase1.yml; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing application source. Phase 1 is not ready for build verification."
              exit 1
            fi
          done
          echo 'Application source present; run full Phase 1 CI checks next.'


  reconcile-expo-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase1/verification-hardening-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/verification-hardening-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile from Expo SDK 58 dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node scripts/verify-lockfile.mjs
          npm ci --no-audit --no-fund
      - name: Commit verified lockfile only when changed
        run: |
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh lockfile for Expo SDK 58 peer dependencies'
            git push origin HEAD:phase1/verification-hardening-20261118
          fi
