name: Phase 1 source readiness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require complete application source before claiming build readiness
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json app.json tsconfig.json src/providers/AuthProvider.tsx src/lib/profiles.ts scripts/phase1-verify.mjs .github/workflows/phase1.yml; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing application source. Phase 1 is not ready for build verification."
              exit 1
            fi
          done
          echo 'Application source present; run full Phase 1 CI checks next.'

  restore-native-assets:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase1/verification-hardening-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1/verification-hardening-20261118
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render original app branding
        run: python3 scripts/generate-brand-assets.py
      - name: Validate generated assets
        run: |
          python3 - <<'PY'
          import pathlib, struct
          for name, color in [('social-eyes-icon.png',2),('social-eyes-adaptive-foreground.png',6)]:
              b = (pathlib.Path('assets/images')/name).read_bytes()
              assert b[:8] == bytes.fromhex('89504e470d0a1a0a')
              assert struct.unpack('>II',b[16:24]) == (1024,1024)
              assert b[25] == color and len(b) > 10000
          PY
      - name: Commit only brand image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- assets/images/social-eyes-icon.png assets/images/social-eyes-adaptive-foreground.png assets/images/social-eyes-mark.png assets/images/brand/aurora.png assets/images/brand/violet-haze.png assets/images/brand/cyan-depth.png
          if ! git diff --cached --quiet; then
            git commit -m 'Generate verified original Social Eyes PNG assets'
            git push origin HEAD:phase1/verification-hardening-20261118
          fi
