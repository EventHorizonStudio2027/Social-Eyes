name: Phase 1 source readiness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require complete application source before claiming build readiness
        shell: bash
        run: |
          set -euo pipefail
          for file in package.json app.json tsconfig.json app/_layout.tsx app/index.tsx src/providers/AuthProvider.tsx src/providers/AppProvider.tsx src/lib/supabase.ts scripts/phase1-verify.mjs .github/workflows/phase1-smoke.yml; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing application source. Phase 1 is not ready for build verification."
              exit 1
            fi
          done
          echo 'Expo application source and active Phase 1 verification workflow are present; native builds and live backend security checks remain separate gates.'
