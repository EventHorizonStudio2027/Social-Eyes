name: Social Eyes CI
on:
  push:
    branches: [main, master, 'phase1/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for TypeScript-aware tests
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Legacy source smoke checks
        run: node tests/smoke.test.cjs
      - name: Foundation tests (Node built-in runner)
        run: node --test tests/*.test.mjs
      - name: Avatar module and integration audit
        run: npm run audit:avatar
      - name: Phase 1 static source audit
        run: node scripts/phase1-static-audit.mjs
      - name: Release preflight report
        if: always()
        run: node scripts/release-preflight.mjs --json
